# The physa check is non-blocking: its check run always concludes neutral
# (02 Q5), so findings are shown, never enforced.
# Pull requests from forks get a read-only token, so the check run cannot be
# written and no check run appears on them.
# The reviewer agent runs only when a Claude credential secret is set
# (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY); without one the check run
# says it was skipped and why. PRs from forks get no secrets, so the reviewer
# is skipped there.
name: physa

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - name: Check out the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build physa
        run: go build -o "$RUNNER_TEMP/physa" ./cmd/physa

      - name: Look for a Claude credential
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.claude.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.claude.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.323

      - name: Run the PR check
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PRESENT: ${{ steps.claude.outputs.present }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$CLAUDE_PRESENT" = "true" ]; then
            "$RUNNER_TEMP/physa" pr-check "$BASE..$HEAD" --pr "$PR" --review --check-run > "$RUNNER_TEMP/output.json"
          else
            "$RUNNER_TEMP/physa" pr-check "$BASE..$HEAD" --pr "$PR" --skip-review "no Claude credential secret is set (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY)" --check-run > "$RUNNER_TEMP/output.json"
          fi

      - name: Write the check run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          jq -n --arg sha "$HEAD" --slurpfile out "$RUNNER_TEMP/output.json" '{name: "physa", head_sha: $sha, status: "completed", conclusion: "neutral", output: ($out[0] // error("empty pr-check output"))}' | gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input -
